<title>Page not found · Kamal Rajput</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07080A;color:#EDEEF0;font-family:Geist,system-ui,sans-serif;text-align:center;padding:24px}
h1{font-weight:500;font-size:clamp(2.4rem,8vw,5rem);letter-spacing:-.04em;margin:0}
h1 em{font-family:"Instrument Serif",Georgia,serif;color:#CDBFFF;font-weight:400}
p{color:#8C919A}
a{display:inline-block;margin-top:1.4rem;color:#07080A;background:#EDEEF0;padding:.9rem 1.3rem;border-radius:999px;text-decoration:none;font-weight:500}
</style>
</head>
<body><div><h1>Page <em>not found.</em></h1><p>The page you're looking for doesn't exist.</p><a id="home" href="/">Back to the homepage</a></div>
<script>/* On a github.io project site the homepage lives under /<repo>/ */
if (/\.github\.io$/.test(location.hostname)) { var seg = location.pathname.split("/")[1]; if (seg) document.getElementById("home").href = "/" + seg + "/"; }</script>
</body>
